# docker-compose.yml — escapa! Frontend
# ─────────────────────────────────────────────────────────────────────
# Uso:
#   Produção local (imagem compilada):  docker compose up --build
#   Dev com hot-reload:                 npm run dev  (não usa Docker)
#
# Para subir em k3s: use o Dockerfile diretamente com uma Registry.
# O Terraform irá referenciar a imagem publicada, não este compose.
# ─────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Suporte a multi-arch (amd64 + arm64 para Apple Silicon)
      args:
        - BUILDKIT_INLINE_CACHE=1

    image: escapa-frontend:local

    container_name: escapa_frontend

    ports:
      - "8080:80"  # Acesse em http://localhost:8080

    environment:
      # Variáveis de ambiente disponíveis em tempo de BUILD (não runtime).
      # Para alterar, rebuild a imagem.
      - NODE_ENV=production

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
