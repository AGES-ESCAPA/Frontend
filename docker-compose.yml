# docker-compose.yml — escapa! Frontend
# ─────────────────────────────────────────────────────────────────────
# Uso:
#   Produção local (imagem compilada):  docker compose up --build
#   Dev com hot-reload:                 npm run dev  (não usa Docker)

# ─────────────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # Suporte a multi-arch (amd64 + arm64 para Apple Silicon)
      args:
        - BUILDKIT_INLINE_CACHE=1
        - VITE_API_BASE_URL=http://localhost:8080/api/v1

    image: escapa-frontend:local

    container_name: escapa_frontend

    ports:
      - '3000:80' # Acesse em http://localhost:3000

    environment:
      - NODE_ENV=production
      # O nginx injeta esta URL no env-config.js consumido pelo navegador.
      - VITE_API_BASE_URL=http://localhost:8080/api/v1

    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
