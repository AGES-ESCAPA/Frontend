# GitLab CI/CD — escapa! Frontend
# Pipeline composta por 4 jobs paralelos: lint, stylelint, format e test.
# Todos rodam na mesma stage "quality" para máxima velocidade.

image: node:20-alpine

# Cache das dependências entre pipelines para acelerar os jobs
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

stages:
  - quality

# Template reutilizável: instala as dependências antes de cada job
.install_deps: &install_deps
  before_script:
    - npm ci --prefer-offline

# ── Job 1: ESLint (TypeScript e React) ────────────────────────────────────────
lint:
  stage: quality
  <<: *install_deps
  script:
    - npm run lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ── Job 2: Stylelint (valida variáveis CSS, proíbe hex hardcoded) ──────────────
stylelint:
  stage: quality
  <<: *install_deps
  script:
    - npm run stylelint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ── Job 3: Prettier (apenas verificação de formatação) ─────────────────────────
format:
  stage: quality
  <<: *install_deps
  script:
    - npm run format:check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ── Job 4: Vitest (Testes unitários) ──────────────────────────────────────────
test:
  stage: quality
  <<: *install_deps
  script:
    - npm run test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "develop"'
