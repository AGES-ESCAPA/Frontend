server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Diretório raiz dos arquivos compilados pelo Vite
    root   /usr/share/nginx/html;
    index  index.html;

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Cache de assets estáticos (Vite gera com hash no nome) ────
    # Os arquivos em /assets/ têm hash no nome (ex: index-abc123.js)
    # então podemos cachear por 1 ano com segurança.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check para k3s / Kubernetes ────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA Routing ───────────────────────────────────────────────
    # Redireciona qualquer rota para o index.html, permitindo que o
    # React Router gerencie a navegação no cliente.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
